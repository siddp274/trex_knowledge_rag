<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TREX Agent</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #050510;
      --bg-card: rgba(15, 15, 30, 0.85);
      --bg-glass: rgba(255, 255, 255, 0.03);
      --bg-glass-hover: rgba(255, 255, 255, 0.06);
      --bg-user: linear-gradient(135deg, #1e40af, #3b82f6);
      --bg-input: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.06);
      --border-focus: rgba(99, 102, 241, 0.5);
      --text-primary: #f0f0f5;
      --text-secondary: #8888a8;
      --text-muted: #55556a;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    /* Animated background */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-glow .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      animation: float 20s ease-in-out infinite;
    }

    .bg-glow .orb:nth-child(1) {
      width: 600px; height: 600px;
      background: #6366f1;
      top: -200px; left: -100px;
      animation-delay: 0s;
    }

    .bg-glow .orb:nth-child(2) {
      width: 500px; height: 500px;
      background: #8b5cf6;
      bottom: -150px; right: -100px;
      animation-delay: -7s;
    }

    .bg-glow .orb:nth-child(3) {
      width: 400px; height: 400px;
      background: #3b82f6;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -14s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.05); }
      66% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* Layout */
    #root {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .chat-card {
      width: 100%;
      max-width: 820px;
      height: calc(100vh - 48px);
      max-height: 900px;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 25px 70px -15px rgba(0,0,0,0.6),
        0 0 40px var(--accent-glow);
      overflow: hidden;
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header */
    .chat-header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,0.01);
    }

    .logo-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .header-text .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .status-dot {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      animation: msgIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .msg-wrapper.user { align-items: flex-end; }
    .msg-wrapper.assistant { align-items: flex-start; }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 4px;
    }

    .msg-bubble {
      max-width: 85%;
      line-height: 1.65;
      font-size: 14px;
      word-wrap: break-word;
    }

    .msg-bubble.user {
      background: var(--bg-user);
      padding: 14px 18px;
      border-radius: 20px 20px 6px 20px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
      white-space: pre-wrap;
    }

    .msg-bubble.assistant {
      padding: 14px 18px;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: 20px 20px 20px 6px;
      color: var(--text-primary);
    }

    /* Markdown inside assistant bubbles */
    .md-content p { margin: 0 0 10px 0; }
    .md-content p:last-child { margin-bottom: 0; }

    .md-content h1, .md-content h2, .md-content h3,
    .md-content h4, .md-content h5, .md-content h6 {
      color: #fff;
      margin: 16px 0 8px 0;
      line-height: 1.3;
    }
    .md-content h1 { font-size: 1.3em; }
    .md-content h2 { font-size: 1.15em; }
    .md-content h3 { font-size: 1.05em; }

    .md-content strong { color: #fff; font-weight: 600; }

    .md-content ul, .md-content ol {
      margin: 8px 0;
      padding-left: 22px;
    }

    .md-content li { margin: 4px 0; }

    .md-content code {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 5px;
      padding: 1.5px 6px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.88em;
      color: #c4b5fd;
    }

    .md-content pre {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 14px 16px;
      margin: 10px 0;
      overflow-x: auto;
    }

    .md-content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      color: #d4d4d8;
    }

    .md-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 4px 0 4px 14px;
      margin: 10px 0;
      color: var(--text-secondary);
    }

    .md-content a {
      color: #818cf8;
      text-decoration: none;
    }
    .md-content a:hover { text-decoration: underline; }

    .md-content table {
      border-collapse: collapse;
      margin: 10px 0;
      width: 100%;
      font-size: 13px;
    }
    .md-content th, .md-content td {
      border: 1px solid rgba(255,255,255,0.08);
      padding: 8px 12px;
      text-align: left;
    }
    .md-content th {
      background: rgba(255,255,255,0.04);
      color: #fff;
      font-weight: 600;
    }

    .md-content hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 14px 0;
    }

    /* Tool pills */
    .tools-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tool-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-secondary);
      transition: all 0.3s ease;
      letter-spacing: 0.01em;
    }

    .tool-pill.running {
      border-color: rgba(245, 158, 11, 0.3);
      color: var(--amber);
      background: rgba(245, 158, 11, 0.06);
    }

    .tool-pill.running .spinner {
      width: 10px; height: 10px;
      border: 1.5px solid rgba(245, 158, 11, 0.3);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .tool-pill.done {
      border-color: rgba(34, 197, 94, 0.3);
      color: var(--green);
      background: rgba(34, 197, 94, 0.06);
    }

    .tool-pill .check { font-size: 12px; }

    /* Typing indicator */
    .typing-dots {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }

    .empty-icon {
      width: 64px; height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(139,92,246,0.1));
      border: 1px solid rgba(99,102,241,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .empty-state h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .empty-state p {
      font-size: 13px;
      max-width: 320px;
      line-height: 1.5;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      justify-content: center;
    }

    .quick-btn {
      font-size: 12px;
      font-family: inherit;
      padding: 8px 16px;
      border-radius: 12px;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quick-btn:hover {
      background: var(--bg-glass-hover);
      border-color: rgba(99, 102, 241, 0.3);
      color: var(--text-primary);
    }

    /* Input area */
    .input-area {
      padding: 20px 28px;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.01);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 6px 6px 18px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-row:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-row textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 40px;
      max-height: 120px;
      padding: 8px 0;
      line-height: 1.5;
    }

    .input-row textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: #4f46e5;
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .input-hint kbd {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: inherit;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="bg-glow">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback, useMemo } = React;

    const API = "http://localhost:8080";

    // Configure marked
    marked.setOptions({ breaks: true, gfm: true });

    function Markdown({ content }) {
      const html = useMemo(() => {
        if (!content) return "";
        return marked.parse(content);
      }, [content]);
      return React.createElement("div", {
        className: "md-content",
        dangerouslySetInnerHTML: { __html: html },
      });
    }

    const QUICK_PROMPTS = [
      "What's in the knowledge base?",
      "Check the graph status",
      "Fetch a YouTube transcript",
      "Run the indexing pipeline",
    ];

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [streaming, setStreaming] = useState(false);
      const [threadId, setThreadId] = useState(null);
      const bottomRef = useRef(null);
      const textareaRef = useRef(null);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      // Auto-resize textarea
      useEffect(() => {
        const ta = textareaRef.current;
        if (ta) {
          ta.style.height = "auto";
          ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
        }
      }, [input]);

      const send = useCallback(async (override) => {
        const text = (override || input).trim();
        if (!text || streaming) return;

        setInput("");
        setStreaming(true);

        const userMsg = { role: "user", content: text };
        const assistantMsg = { role: "assistant", content: "", tools: [], streaming: true };
        setMessages(prev => [...prev, userMsg, assistantMsg]);

        try {
          const res = await fetch(`${API}/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, thread_id: threadId }),
          });

          const tid = res.headers.get("X-Thread-Id");
          if (tid) setThreadId(tid);

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();

            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              let evt;
              try { evt = JSON.parse(line.slice(6)); } catch { continue; }

              if (evt.type === "token") {
                setMessages(prev => {
                  const updated = [...prev];
                  const last = { ...updated[updated.length - 1] };
                  last.content += evt.content;
                  updated[updated.length - 1] = last;
                  return updated;
                });
              } else if (evt.type === "tool_start") {
                setMessages(prev => {
                  const updated = [...prev];
                  const last = { ...updated[updated.length - 1] };
                  last.tools = [...(last.tools || []), { name: evt.tool, status: "running" }];
                  updated[updated.length - 1] = last;
                  return updated;
                });
              } else if (evt.type === "tool_end") {
                setMessages(prev => {
                  const updated = [...prev];
                  const last = { ...updated[updated.length - 1] };
                  last.tools = (last.tools || []).map(t =>
                    t.name === evt.tool && t.status === "running"
                      ? { ...t, status: "done" } : t
                  );
                  updated[updated.length - 1] = last;
                  return updated;
                });
              }
            }
          }
        } catch (err) {
          setMessages(prev => {
            const updated = [...prev];
            const last = { ...updated[updated.length - 1] };
            last.content += `\n[Error: ${err.message}]`;
            updated[updated.length - 1] = last;
            return updated;
          });
        }

        // Mark streaming done
        setMessages(prev => {
          const updated = [...prev];
          const last = { ...updated[updated.length - 1] };
          last.streaming = false;
          updated[updated.length - 1] = last;
          return updated;
        });

        setStreaming(false);
        textareaRef.current?.focus();
      }, [input, streaming, threadId]);

      function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      }

      const isEmpty = messages.length === 0;

      return (
        <div className="chat-card">
          {/* Header */}
          <div className="chat-header">
            <div className="logo-icon">T</div>
            <div className="header-text">
              <h1>TREX Agent</h1>
              <div className="subtitle">GraphRAG Knowledge Assistant</div>
            </div>
            <div className="status-dot">Online</div>
          </div>

          {/* Messages */}
          {isEmpty ? (
            <div className="empty-state">
              <div className="empty-icon">&#x1F50D;</div>
              <h2>Ask anything about your knowledge base</h2>
              <p>Query indexed documents, fetch YouTube transcripts, or run the indexing pipeline.</p>
              <div className="quick-actions">
                {QUICK_PROMPTS.map((q, i) => (
                  <button key={i} className="quick-btn" onClick={() => send(q)}>{q}</button>
                ))}
              </div>
            </div>
          ) : (
            <div className="messages">
              {messages.map((msg, i) => (
                <div key={i} className={`msg-wrapper ${msg.role}`}>
                  <div className="msg-label">{msg.role === "user" ? "You" : "TREX"}</div>
                  <div className={`msg-bubble ${msg.role}`}>
                    {msg.tools && msg.tools.length > 0 && (
                      <div className="tools-row">
                        {msg.tools.map((t, j) => (
                          <span key={j} className={`tool-pill ${t.status}`}>
                            {t.status === "running"
                              ? <span className="spinner" />
                              : <span className="check">&#x2713;</span>
                            }
                            {t.name}
                          </span>
                        ))}
                      </div>
                    )}
                    {msg.role === "assistant"
                      ? <Markdown content={msg.content} />
                      : msg.content
                    }
                    {msg.streaming && !msg.content && (
                      <div className="typing-dots">
                        <span /><span /><span />
                      </div>
                    )}
                  </div>
                </div>
              ))}
              <div ref={bottomRef} />
            </div>
          )}

          {/* Input */}
          <div className="input-area">
            <div className="input-row">
              <textarea
                ref={textareaRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKey}
                placeholder="Ask something..."
                rows={1}
                disabled={streaming}
              />
              <button className="send-btn" onClick={() => send()} disabled={streaming || !input.trim()}>
                {streaming ? (
                  <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg>
                ) : (
                  <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                )}
              </button>
            </div>
            <div className="input-hint">
              <kbd>Enter</kbd> to send &middot; <kbd>Shift + Enter</kbd> for new line
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
