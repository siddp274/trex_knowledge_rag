version: "3.9"

services:
  # ── Vector DB ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: trex-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-my_api_key}
    restart: unless-stopped

